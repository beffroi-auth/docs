name: Check

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        name: Strict build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: Install the toolchain
              run: pip install -r requirements.txt

            # The front matter of a page is YAML: a description holding ": " or a backslash does not parse.
            # The build stops at the first such page; this lists every one of them.
            - name: Check the front matter
              run: python3 -I tools/front-matter.py docs

            # A page absent from the navigation, or an entry of the navigation that is not a page. Zensical
            # validates links and anchors, not the navigation.
            - name: Check the navigation
              run: python3 -I tools/nav.py mkdocs.yml

            # --strict turns every warning into an error: a broken internal link, an anchor that does not
            # exist, a redirect to a page that does not exist.
            - name: Build
              run: zensical build --strict
