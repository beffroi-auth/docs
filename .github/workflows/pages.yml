name: Pages

# One version of the site per branch, published by mike into gh-pages: 0.1 is served at /0.1/, and the
# alias "latest" follows the highest released version, which is what the root of the site redirects to. Pages is
# configured to deploy from the gh-pages branch, root folder, on the domain doc.beffroi.tech that the CNAME
# file at the root of gh-pages names: mike writes only the directories of a version and of its aliases, the
# root redirect and versions.json, so it never touches that file.
on:
    push:
        branches:
            - '[0-9]*.[0-9]*'
            - '[0-9]*.x'
        paths-ignore:
            - '.github/workflows/check.yml'
    workflow_dispatch:

# MkDocs 2.0 is announced as backward incompatible with every plugin and theme, so the toolchain is pinned
# to the 1.x line in requirements.txt and the two notices about it are silenced: they are news about the
# ecosystem, not findings about this site.
env:
    NO_MKDOCS_2_WARNING: 'true'
    DISABLE_MKDOCS_2_WARNING: 'true'

permissions:
    contents: write

# Two branches pushed at once must not write gh-pages at the same time, and a queued run is never
# cancelled: it carries a version the other does not.
concurrency:
    group: gh-pages
    cancel-in-progress: false

jobs:
    deploy:
        name: Deploy ${{ github.ref_name }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: Install the toolchain
              run: pip install -r requirements.txt

            - name: Identify the committer
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # The highest version branch whose version is released, a branch X.Y being released once the
            # code repository carries a tag X.Y.Z: only that branch carries "latest", so the root of the site
            # describes what can be installed. A branch "1.x" is where the next minor is written and never a
            # release. Until a first release, the highest version branch carries it, and a site of one version
            # branch gives it "latest" without reading a tag. A tag list that cannot be read fails the run
            # rather than moving "latest" on a guess.
            - name: Is this the newest released version?
              id: newest
              run: |
                  set -o pipefail
                  git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*'
                  branches=$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/*' \
                    | grep -E '^[0-9]+\.([0-9]+|x)$' \
                    | sort -V)
                  newest=""
                  tags=""
                  if [ "$(wc -l <<< "$branches")" -gt 1 ]; then
                    tags=$(git ls-remote --tags --refs https://github.com/beffroi-auth/beffroi.git \
                      | sed 's#^.*refs/tags/##')
                  fi
                  for branch in $branches; do
                    if [[ "$branch" =~ ^[0-9]+\.[0-9]+$ ]] && grep -qxE "${branch//./\\.}\.[0-9]+" <<< "$tags"; then
                      newest="$branch"
                    fi
                  done
                  if [ -z "$newest" ]; then
                    newest=$(tail -n 1 <<< "$branches")
                  fi
                  echo "The newest released version branch is '$newest', this one is '${GITHUB_REF_NAME}'."
                  if [ "$newest" = "${GITHUB_REF_NAME}" ]; then
                    echo "latest=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "latest=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Publish this version
              if: steps.newest.outputs.latest == 'false'
              run: mike deploy --push --update-aliases "${GITHUB_REF_NAME}"

            - name: Publish this version as the latest one
              if: steps.newest.outputs.latest == 'true'
              run: |
                  mike deploy --push --update-aliases "${GITHUB_REF_NAME}" latest
                  mike set-default --push latest
