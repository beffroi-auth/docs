markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      title: On this page
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      # The icons of the brand, as :beffroi-key:, from docs/overrides/.icons/beffroi.
      options:
        custom_icons:
          - docs/overrides/.icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tilde

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
  nav:
    omitted_files: warn

extra:
  status:
    draft: This page is a stub, the section it belongs to is not written yet
    new: Added in this version
  version:
    provider: mike
    alias: true
    default: latest
  social:
    - icon: fontawesome/solid/globe
      link: https://beffroi.tech
      name: The website of Beffroi
    - icon: fontawesome/brands/github
      link: https://github.com/beffroi-auth
      name: Beffroi on GitHub
    - icon: fontawesome/brands/php
      link: https://packagist.org/packages/beffroi/
      name: The packages on Packagist
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/beffroi.tech
      name: Beffroi on Bluesky
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/beffroi-auth
      name: Beffroi on LinkedIn

