site_name: Beffroi
site_description: An identity provider for the Symfony ecosystem. OAuth 2.0, OpenID Connect and SAML 2.0, on a pure-PHP core.
site_url: https://doc.beffroi.tech/
site_author: The Beffroi contributors
copyright: Released under the MIT licence
repo_url: https://github.com/beffroi-auth/beffroi
repo_name: beffroi-auth/beffroi
edit_uri: https://github.com/beffroi-auth/docs/edit/0.2/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  # Archivo, Chakra Petch and Martian Mono are served by the site itself, from assets/fonts.
  font: false
  logo: assets/images/beffroi-lockup-S-bichrome.svg
  icon:
    repo: fontawesome/brands/github
    edit: beffroi/edit
    annotation: material/plus-circle
  favicon: assets/images/favicon.svg
  # Light by default, as the brand guidelines ask; the ink scheme is one click away.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the dark theme
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light theme
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.instant.progress
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit

extra_css:
  - assets/stylesheets/beffroi.css

plugins:
  - search
  # Any external asset the theme asks for is downloaded at build time and served from this site, except the
  # script of OpenPanel: it is loaded from where it is published, which serves its current version, and
  # OpenPanel is the one third party a reader reaches.
  - privacy:
      assets_exclude:
        - openpanel.dev/*
  - git-revision-date-localized:
      enable_creation_date: false
      type: date
      fallback_to_build_date: true
  - redirects:
      redirect_maps:
        getting-started/a-symfony-relying-party.md: developers/connect/symfony.md
        application/account.md: operators/application/account.md
        application/configuration-tree.md: operators/application/configuration-tree.md
